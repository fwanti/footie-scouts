[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "footie-scouts"
version = "0.1.1"
dependencies = [
    "requests",
    "python-dotenv",
    "pandas",
    "pyodbc",
    "sqlalchemy",
    "psycopg2"
]

[tool.setuptools.packages.find]
where = ["src"]